<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e4b86" />
  <meta name="description" content="初一食午今日店務、薪資、記帳與收入支出分析系統" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="初一食午" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/salary_app/assets/app-icon-180.png" />
  <link rel="icon" sizes="32x32" href="/salary_app/assets/favicon-32.png" />
  <script src="/shared/protected-page.js"></script>
  <script defer src="/shared/pwa-install.js"></script>
  <link rel="stylesheet" href="/shared/operations-shell.css" />
  <link rel="stylesheet" href="/shared/home.css" />
  <script src="/shared/operations-store.js"></script>
  <script defer src="/shared/operations-shell.js"></script>
  <script defer src="/shared/home.js"></script>
  <title>初一食午｜今日店務中心</title>
</head>
<body class="operations-home">
  <header class="home-topbar">
    <a class="home-brand" href="/">
      <img src="/salary_app/assets/app-icon-192.png" alt="" />
      <span><strong>初一食午</strong><small>今日店務中心</small></span>
    </a>
    <div class="home-top-actions">
      <label>營運月份<input id="home-month" type="month" /></label>
      <span id="home-cloud-state" class="home-status is-loading"><i></i>讀取中</span>
      <button id="home-refresh" type="button">重新整理</button>
    </div>
  </header>

  <main>
    <section class="home-heading">
      <div>
        <p class="eyebrow">DAILY OPERATIONS</p>
        <h1 id="home-greeting">今天先處理最重要的事。</h1>
        <p id="home-subtitle">正在彙整記帳、薪資與雲端同步狀態。</p>
      </div>
      <div id="home-health-mini" class="health-mini" aria-label="系統健康狀態"></div>
    </section>

    <section id="home-kpis" class="home-kpis" aria-label="本月營運摘要"></section>

    <section class="home-grid home-grid-primary">
      <article class="home-panel action-panel">
        <header><div><p class="eyebrow">ACTION CENTER</p><h2>今日待辦</h2></div><span id="home-action-count" class="count-chip">0 項</span></header>
        <div id="home-actions" class="home-action-list"><p class="empty-copy">正在檢查店務資料…</p></div>
      </article>

      <article class="home-panel budget-panel">
        <header><div><p class="eyebrow">BUDGET & COST</p><h2>預算與成本警示</h2></div><a href="/accounting/#budget">設定預算</a></header>
        <div id="home-budget" class="home-budget-list"><p class="empty-copy">尚未取得預算資料。</p></div>
      </article>
    </section>

    <section class="system-shortcuts" aria-label="營運系統功能">
      <a class="system-card accounting" href="/accounting/"><i>帳</i><span><strong>快速記帳</strong><small>收入、支出與每日關帳</small></span><b>進入 →</b></a>
      <a class="system-card salary" href="/salary_app/"><i>薪</i><span><strong>薪資與打卡</strong><small>出勤、AI 辨識與月結</small></span><b>進入 →</b></a>
      <a class="system-card analytics" href="/dashboard_cost/"><i>析</i><span><strong>經營分析</strong><small>損益、成本與供應商趨勢</small></span><b>進入 →</b></a>
    </section>

    <section class="home-grid home-grid-secondary">
      <article class="home-panel">
        <header><div><p class="eyebrow">SYNC CENTER</p><h2>雲端同步中心</h2></div></header>
        <div id="home-sync" class="sync-list"></div>
      </article>
      <article class="home-panel">
        <header><div><p class="eyebrow">RECENT ACTIVITY</p><h2>最近操作</h2></div></header>
        <div id="home-audit" class="audit-list"><p class="empty-copy">尚無操作紀錄。</p></div>
      </article>
    </section>
  </main>

  <footer><span>初一食午｜營運管理系統</span><span>資料異常優先・本機與雲端雙重保護</span></footer>
  <div id="home-toast" class="home-toast" role="status" aria-live="polite"></div>
</body>
</html>
